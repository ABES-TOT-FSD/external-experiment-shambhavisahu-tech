<!Doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title> Navigation Menu </title>

  <style>
	header{
	    display:block;
	    background:grey;
	    padding:10px;
	    text-align:center;
	}
	header span{
	  display:inline;
	  color:red;
	}
	.inline-block ul{
	   list-style:none;
	   padding:0;
	}
	.inline-block li{
	   display:inline-block;
	   margin-right:10px;
	}
	.inline-block a{
	  padding:5px;
	  background:blue;
	}
	.float-menu ul{
	  list-style:none;
	  padding:0;
	}
	.float-menu li{
	  float:left;
	  margin-right:10px;
	}
	.float-menu a{
	  padding:5px;
	  background:green;
	}

</style>
</head>
<body>
	<header>My<span>Website</span></header>
	<nav class="inline-block">
	<ul>
	<li><a href="#">home</a><li>
	<li><a href="#">about</a><li>
	<li><a href="#">sevice</a><li>
	<li><a href="#">contact</a><li>
	</ul>
	</nav>

	<nav class="float-menu">
	<ul>
	<li><a href="#">profile</a><li>
	<li><a href="#">dashboard</a><li>
	<li><a href="#">logout</a><li>
	<li><a href="#">messages</a><li>
	</ul>
	</nav>
</body>
</html>
